[project]
name = "mcp-harness"
version = "0.1.0"
description = "Dynamic exploitation harness for MCP servers"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "harness.scenarios", "harness.oracle", "testserver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
